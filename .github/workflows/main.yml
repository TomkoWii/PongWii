name: Debug Wii Pong Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    defaults:
      run:
        shell: bash -l {0} # Force login shell to load devkitPro paths
    steps:
      - uses: actions/checkout@v4

      - name: 1. Check Project Structure
        run: |
          echo "=== CURRENT DIRECTORY ==="
          pwd
          echo "=== ALL FILES IN PROJECT ==="
          find . -maxdepth 3
          echo "=== ENVIRONMENT VARIABLES ==="
          echo "DEVKITPRO: $DEVKITPRO"
          echo "DEVKITPPC: $DEVKITPPC"

      - name: 2. Run Compilation
        run: |
          echo "=== RUNNING MAKE CLEAN ==="
          make clean || echo "make clean failed or not supported"
          
          echo "=== RUNNING MAKE ==="
          make V=1
          
          echo "=== STRUCTURE AFTER BUILD ==="
          find . -maxdepth 3

      - name: 3. Package Application
        run: |
          mkdir -p out/apps/wiipong
          
          # Find any generated .dol or .elf files
          DOL_FILE=$(find . -name "*.dol" | head -n 1)
          ELF_FILE=$(find . -name "*.elf" | head -n 1)
          
          if [ ! -z "$DOL_FILE" ]; then
            echo "Found DOL file: $DOL_FILE"
            cp "$DOL_FILE" out/apps/wiipong/boot.dol
          elif [ ! -z "$ELF_FILE" ]; then
            echo "Found ELF file ($ELF_FILE). Converting to DOL..."
            elf2dol "$ELF_FILE" out/apps/wiipong/boot.dol
          else
            echo "ERROR: No .dol or .elf files were created by the compiler!"
          fi
          
          if [ -f meta.xml ]; then 
            cp meta.xml out/apps/wiipong/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wiipong
          path: out
          
