name: Build Wii Pong
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4

      - name: Build Homebrew
        run: |
          mkdir -p build
          make -C build -f ../Makefile boot.dol

      - name: Package
        run: |
          mkdir -p out/apps/wiipong
          cp build/boot.dol out/apps/wiipong/boot.dol
          cp meta.xml out/apps/wiipong/

      - uses: actions/upload-artifact@v4
        with:
          name: wiipong
          path: out
          
